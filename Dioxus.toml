[application]
name = "synstudy"
default_platform = "desktop"

# Directory containing bundled assets (stylesheets, images, dictionary db).
# In dioxus-cli 0.7.10 this must be a plain path string under [application].
asset_dir = "assets"

# Bundle identifier + version used across macOS .app / iOS .ipa / Android APK.
# Reverse-DNS app identity: the unique key on App Store / Google Play, so it
# must match signing & provisioning and never change after first release.
# (The desktop writable data dir — progress.db, downloaded models — is keyed by
# the same reverse-DNS id, but hardcoded in src/platform/native.rs: macOS uses
# this id verbatim, Windows nests %APPDATA%\Synvek\Synstudy\data (proper-noun
# casing), Linux only ~/.local/share/synstudy. Editing this line does NOT move
# user data; keep the two in sync, and change neither once real users exist.)
[bundle]
identifier = "com.synvek.synstudy"
publisher = "synvek"
version = "1.2.0"
# App icon source (1024px PNG, the branded master generated from
# assets/logo.svg by scripts/gen_icons.py). NOTE: dx 0.8.0-alpha.1 does NOT
# bundle a usable icon on any platform -- macOS writes/omits CFBundleIconFile
# but never produces the .icns; iOS and Android ignore this field entirely.
# All three are patched post-build by scripts/inject_macos_icon.py (icon.icns),
# scripts/inject_ios_icon.py (CFBundleIconFiles) and package_android.sh (mipmap
# override), each run inside its package_*.sh script.
icon = ["assets/icons/app-icon.png"]
# Files copied into the platform's bundle resource directory.
# Paths are relative to the crate root.
resources = [
    "assets/synstudy.db",
    "assets/THIRD-PARTY-NOTICES.txt",
]

# Legacy desktop window settings; the CLI tolerates (and largely ignores) this
# block in 0.7.10, but we keep it for documentation and future revival.
[desktop]
title = "英语学习词典"
width = 1180
height = 800
min_width = 900
min_height = 640
resizable = true
maximizable = true

[ios]
identifier = "com.synvek.synstudy"
publisher = "synvek"
# Minimum iOS the app can install on. WKWebView `speechSynthesis` needs 17+
# for audio output; the UI itself works down to 15.
deployment_target = "15.0"

# iOS 26+ / 27 hard-asserts (SIGTRAP) at launch if the app has not adopted the
# UIKit scene-based lifecycle (TN3187). dioxus 0.7 pins tao 0.34 which does not;
# we moved to the 0.8 pre-release line so tao 0.35 implements
# `configurationForConnectingSceneSession` (returns a UISceneConfiguration wired
# to TaoSceneDelegate). tao then attaches each window to its UIWindowScene only
# when it reads UIApplicationSupportsMultipleScenes == YES here, so the manifest
# must be present and true, otherwise the window is created off-scene and shows
# a black screen on iOS 27. dx's own Info.plist template omits this key, so we
# inject it via [ios.plist] (nested dict supported by the CLI plist serializer).
[ios.plist]
UIApplicationSceneManifest = { UIApplicationSupportsMultipleScenes = true }
# Home-screen icon caption (dx seeds these from [application] name; overriding
# here gives the Chinese display name). CFBundleName must stay <= 15 chars.
CFBundleDisplayName = "英语学习词典"
CFBundleName = "英语学习词典"
# 翻译权限（NSCameraUsageDescription / NSPhotoLibraryUsageDescription）不再写
# 在这里：dx 0.8.0-alpha.1 会把下方统一 [permissions] 段的 usage description
# 与 [ios.plist] 的条目渲染进同一个 Info.plist <dict>，两处都写会产生重复键。

# 翻译功能（translate feature）移动端「拍照 / 相册」的统一权限声明：
#   * Android → AndroidManifest.xml 生成 CAMERA / READ_MEDIA_IMAGES。
#     CAMERA 声明后 wry 的 RustWebChromeClient 才会对 <input capture> 走
#     系统相机（ACTION_IMAGE_CAPTURE）并在运行时申请权限；相册走 SAF
#     选择器本身免权限，声明仅作商店合规展示。
#   * iOS → Info.plist 生成 NS*UsageDescription；缺失会在点「拍照」时直接崩溃。
#   * macOS 也会拿到同名 NS 键（桌面端不触发这些 API，无害）。
# 拍照临时文件回传还依赖 FileProvider 注册，dx 模板无此配置入口，由
# scripts/package_android.sh 构建后置注入（见其 4c 步）。
[permissions.camera]
description = "用于拍摄书籍、讲义或试卷截图后进行翻译。"

[permissions.photos]
access = "read"
description = "用于从相册选择图片后进行翻译。"

[android]
identifier = "com.synvek.synstudy"
publisher = "synvek"
min_sdk = 24
target_sdk = 34
