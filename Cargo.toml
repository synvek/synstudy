[package]
name = "synstudy"
version = "1.1.0"
edition = "2021"
description = "Offline multi-platform English learning tool built with Dioxus"
license = "MIT"
repository = "https://github.com/synvek/synstudy"
homepage = "https://github.com/synvek/synstudy"

# Library target: consumed by the thin `synstudy` desktop binary AND directly
# by iOS (as a staticlib linked into the Xcode app) and Android (as a cdylib
# loaded through JNI from the WryActivity). Keeping the app entry as `main`
# (no_mangle, extern "C") is what dioxus-desktop's mobile shim dlsyms into.
[lib]
name = "synstudy"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "synstudy"
path = "src/main.rs"

[dependencies]
# Upgraded to the 0.8 pre-release line specifically to pull in tao >=0.35, which
# adopts the UIKit UIScene lifecycle. tao 0.34 (dioxus 0.7) does not, and iOS 27
# hard-asserts on non-scene apps at launch (SIGTRAP). Cargo will not auto-select
# a pre-release, so the version is pinned explicitly.
#
# NOTE: pinned with `=` (exact), not a caret. A bare "0.8.0-alpha.1" means
# `^0.8.0-alpha.1` (>=alpha.1, <0.9.0), so cargo silently floats up to newer
# pre-releases (e.g. alpha.3) — and `dx bundle` hard-fails with "dx and dioxus
# versions are incompatible" whenever the installed dx CLI (0.8.0-alpha.1, per
# Dioxus.toml / docs / CI) lags behind. Keep this in lockstep with the dx CLI
# version; bump both together. dioxus-desktop 0.8.0-alpha.1 already carries
# tao 0.35.2, so pinning down here does NOT regress the iOS UIScene fix.
dioxus = { version = "=0.8.0-alpha.1", features = ["desktop"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
fsrs = "6"

# --- Screenshot/photo translation (opt-in `translate` feature) -------------
# All heavy, native-build dependencies are optional and gated behind the
# `translate` feature so the default build (and CI / mobile) stays light and
# does not require cmake / clang / multi-GB models. See docs/translate.md.
#
# OCR: PaddleOCR models on the MNN inference engine (Apache-2.0). Cross-
# platform native backend; the same crate serves desktop and (Phase 3) mobile.
# NOTE: upstream renamed the crate to `ocr-rs` (v2.x) on the repo's default
# branch (`master`). Our code targets the `rust-paddle-ocr` v1.4.2 API on the
# `main` branch (which also matches the OCR model download URLs in models.rs,
# served from `.../raw/main/models/`), so we pin `branch = "main"` explicitly —
# otherwise cargo resolves the default branch and fails with "no matching
# package named `rust-paddle-ocr`". Migrating to `ocr-rs` 2.x is a follow-up
# (import name + Det/Rec API + model layout all change).
rust-paddle-ocr = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", branch = "main", optional = true }
# NOTE: `rust-paddle-ocr` pulls the `mnn` crate (aftershootco/mnn-rs) as a FLOATING
# git dep (no rev), which upstream has since changed in an incompatible way
# (`mnn::Session` gained a lifetime; `copy_from_host_tensor` signature moved).
# v1.4.2 only compiles against mnn rev `1a275e70` (the rev in its own lockfile),
# so `Cargo.lock` pins `mnn`/`mnn-sys` there. A plain `cargo update` would float it
# back to the breaking HEAD. To restore after an accidental update:
#   cargo update -p mnn --precise 1a275e70336d2f21603a41b22b3b257bc3b49333
# ([patch] on the same URL, or adding `mnn={rev=..}` directly, both fail: "patches
# must point to different sources" / `links="mnn"` conflict.) See docs/translate.md.
# Translation: HY-MT1.5-1.8B GGUF via llama.cpp FFI bindings. Metal is enabled
# by llama.cpp automatically on Apple targets; Vulkan/CUDA are opt-in through
# the `translate-vulkan` / `translate-cuda` features below.
llama-cpp-2 = { version = "0.1", optional = true }
# Blocking model downloader + SHA-256 verification. `image` for decode/crop.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = { version = "0.10", optional = true }
image = { version = "0.25", optional = true }
# Base64 decoding for the mobile file picker (JS FileReader → dataURL → Rust).
base64 = { version = "0.22", optional = true }
# Portable async sleep for the UI's engine-inbox polling loop. Dioxus 0.8's
# desktop prelude exposes no timer (its `TimeoutFuture` is gloo/wasm-only), so
# we use futures-timer's cross-platform `Delay` (native helper thread + wasm).
futures-timer = { version = "3", optional = true }

# Desktop-only: `directories` returns a macOS/Linux/Windows app-data folder.
# Not usable on iOS/Android sandboxes, so we gate it out and route through
# `crate::platform` instead.
# `xcap` (screen grab) is likewise desktop-only: iOS uses the WebView file/camera
# picker and Android would need a JNI bridge, so leaving it under `translate`
# would break mobile builds of that feature.
# Native file-open dialog (MIT/Apache-2.0) for the translate page's "打开图片"
# button. Desktop-only (mobile uses the webview file/camera picker in Phase 3).
# Blocking API only, so we drop rfd's default (async/tokio) features.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
directories = "5"
xcap = { version = "0.9", optional = true }
rfd = { version = "0.15", optional = true, default-features = false }

# macOS: `libc::atexit` lets the translate engine release its resident
# llama/Metal resources during `exit()` before ggml's own Metal device
# destructor runs (otherwise it asserts `Abort trap: 6` at teardown). The crash
# is Metal-specific, so the dependency is scoped to macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# iOS native bridges: bundle path lookup + the native image picker
# (`UIImagePickerController`): WKWebView refuses the HTML file panel for the
# custom `dioxus://` scheme origin, so camera/album selection is presented
# from Rust (see src/platform/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSBundle", "NSData", "NSDictionary"] }
objc2-ui-kit = { version = "0.3", features = ["UIImage", "UINavigationController", "UIResponder", "UIViewController"] }

# Android native bridges: `ndk-context` for JVM/AActivity handles, `jni` for
# driving `android.speech.tts.TextToSpeech` from Rust.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk-context = "0.1"
jni = "0.21"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

# Opt-in local screenshot/photo translation (OCR + machine translation).
# Off by default: pulls native-build deps (cmake/clang) and downloads models at
# runtime. Enable with `cargo run --features translate`.
translate = [
    "dep:rust-paddle-ocr",
    "dep:llama-cpp-2",
    "dep:xcap",
    "dep:reqwest",
    "dep:sha2",
    "dep:image",
    "dep:futures-timer",
    "dep:rfd",
    "dep:base64",
]
# GPU backends for the llama.cpp translation engine. Metal is on automatically
# for Apple targets, so these only matter for Windows/Linux (Vulkan) or NVIDIA
# (CUDA). Each implies the base `translate` feature.
translate-vulkan = ["translate", "llama-cpp-2/vulkan"]
translate-cuda = ["translate", "llama-cpp-2/cuda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# --- 本地修补：tao 0.35.3 的 iOS scene 生命周期 use-after-free ---
#
# dioxus 0.8.0-alpha.1 把 tao 锁在 ^0.35.2（该系列最新就是 0.35.3，上游修复只在
# dev / 0.36+ 里），所以只能自己 patch。vendor/tao 是 crates.io 0.35.3 的完整副本，
# 仅改了一行：src/platform_impl/ios/view.rs 的
# `configuration_for_connecting_scene_session` 返回值从 `Retained::as_ptr(&config)`
# 改为 `Retained::autorelease_ptr(config)`（与上游 dev 分支一致）。
#
# 症状：iOS【真机】包启动即闪退，崩溃报告为 EXC_BAD_ACCESS / SIGSEGV，栈顶是
# libobjc `objc_retain` <- UIKitCore `-[UIApplication _connectUISceneFromFBSScene:
# transitionContext:]`，下面直接是我们的 `synstudy::run -> dioxus launch ->
# tao EventLoop::run -> UIApplicationMain`，Rust 侧无任何日志输出。
# 原因：该 delegate 方法按 ObjC 约定返回 +0 对象，`as_ptr` 之后 `Retained` 立刻
# drop（= release），UIKit 异步连接 scene 时用的是已被回收/复用的内存；是否踩雷
# 取决于分配器时序，所以 debug、模拟器（26.5/27.0）以及某些 release 代码生成配置
# （lto=false + codegen-units=16）看起来正常，而 lto=true / codegen-units=1 的真机
# 包 100% 崩溃（同一二进制反复启动 5 次全崩，已实测）。
# 注意：不能靠删 Info.plist 的 UIApplicationSceneManifest 绕过 —— iOS 27 上无 scene
# 声明的包直接被拒绝启动（模拟器 iPhone 18 Pro / iOS 27.0 实测装不上、报“Needs to Be
# Updated”），Apple 已强制要求 scene 生命周期。
#
# 后续 dioxus 升到依赖 tao >=0.36 的版本时，删掉本节即可（先用
# `cargo update -p tao` 确认解析到的版本不再走 patch）。
[patch.crates-io]
tao = { path = "vendor/tao" }
