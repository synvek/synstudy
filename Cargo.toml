[package]
name = "synstudy"
version = "0.1.0"
edition = "2021"
description = "Offline multi-platform English learning tool built with Dioxus"
license = "MIT"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
fsrs = "6"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
