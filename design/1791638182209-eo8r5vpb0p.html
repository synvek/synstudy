<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>synstudy · 词典</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
  <style type="text/tailwindcss">
    @theme { --color-primary: #6366f1; --font-sans: 'Inter','Noto Sans SC',sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div class="mx-auto max-w-[430px] min-h-screen pb-24">
    <header class="px-5 pt-12 pb-4">
      <h1 class="text-2xl font-bold tracking-tight">英汉词典</h1>
      <p class="mt-1 text-xs text-slate-400">共收录 <span class="font-medium text-slate-600">770,739</span> 词</p>
    </header>
    <div class="px-5">
      <div class="inline-flex rounded-full border border-slate-200 bg-white p-1 text-sm">
        <button class="rounded-full bg-primary px-6 py-1.5 text-white font-medium">英汉</button>
        <button class="rounded-full px-6 py-1.5 text-slate-500">汉英</button>
      </div>
    </div>
    <form class="mt-4 px-5" onsubmit="event.preventDefault()">
      <div class="flex h-12 items-center gap-3 rounded-xl border border-indigo-200 bg-white px-4 shadow-sm">
        <i class="fa-solid fa-magnifying-glass text-primary"></i>
        <input class="flex-1 bg-transparent text-sm outline-none placeholder:text-slate-400" placeholder="输入英文单词查询，如 achieve...">
      </div>
    </form>
    <div class="mt-8 px-5 flex flex-col items-center text-center">
      <div class="mb-5 grid size-20 place-items-center rounded-2xl bg-indigo-50 text-3xl text-indigo-300">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <h3 class="text-base font-semibold text-slate-600">输入单词开始查询</h3>
      <p class="mt-2 text-xs text-slate-400 leading-relaxed">单词、短语，或一个好奇的念头<br>从搜索开始探索</p>
      <div class="mt-6 flex gap-4 text-xs text-slate-400">
        <span><i class="fa-solid fa-check mr-1.5 text-indigo-400"></i>中英释义</span>
        <span><i class="fa-solid fa-check mr-1.5 text-indigo-400"></i>地道发音</span>
        <span><i class="fa-solid fa-check mr-1.5 text-indigo-400"></i>实用例句</span>
      </div>
    </div>
  </div>
  <nav class="fixed bottom-0 left-0 right-0 border-t border-slate-200 bg-white pb-safe">
    <div class="mx-auto max-w-[430px] flex justify-around py-2">
      <a class="flex flex-col items-center gap-1 px-4 py-1 text-primary">
        <i class="fa-solid fa-book text-lg"></i>
        <span class="text-[10px] font-medium">词典</span>
      </a>
      <a class="flex flex-col items-center gap-1 px-4 py-1 text-slate-400">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px]">词库</span>
      </a>
      <a class="flex flex-col items-center gap-1 px-4 py-1 text-slate-400">
        <i class="fa-solid fa-graduation-cap text-lg"></i>
        <span class="text-[10px]">学习</span>
      </a>
      <a class="flex flex-col items-center gap-1 px-4 py-1 text-slate-400">
        <i class="fa-solid fa-heart text-lg"></i>
        <span class="text-[10px]">生词本</span>
      </a>
      <a class="flex flex-col items-center gap-1 px-4 py-1 text-slate-400">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px]">我的</span>
      </a>
    </div>
  </nav>
</body>
</html>
